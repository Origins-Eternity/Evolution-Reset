# Configuration file

general {

    ##########################################################################################################
    # compat
    #--------------------------------------------------------------------------------------------------------#
    # Compat Options
    ##########################################################################################################

    compat {
        # Whether to make arc furnace prefer to match the one with additives when the two recipe inputs are the same.
        B:"Better ArcFurnace Recipes"=true

        # Whether to restore the previous fluid state after the ocean crops(kelp, coral and sea pickle) added by Oceanic Expanse are destroyed, instead of creating a water source at the position.
        B:"Better Ocean Crops Replace"=true

        # Whether to allow the gravestone store player's experience or not.
        B:"Enable Grave Experience"=true

        # Whether to add herbs or not. (Require First Aid mod)
        B:"Enable Herbs"=true

        # Whether to fix the empty lootr minecart issue and replace naturally generated chests in world chests with Lootr chests or not.
        B:"Enable Lootr Fix"=true

        # Whether to add a new tinker's material or not. (Require enable items, fluids and ores)
        B:"Enable Material"=true

        # Whether to fix the issue that player's health changes when login with First Aid mod.
        B:"Enable MaxHealth Fix"=true

        # Whether to add a rock campfire as an upgraded version of the campfire in Pyrotech mod.
        B:"Enable Rock Campfire"=true

        # Whether to fix the issue that thirst overlay in Tough As Nails mod sometimes displays abnormal.
        B:"Enable Thirst Overlay Fix"=true

        # Whether to fix the issue that the thirst quencher in TanExpansion mod can produce unlimited fluids.
        B:"Enable Thirst Quencher Fix"=true

        # Limit the stack size of tanks with liquids in Pyrotech mod. Set this to 0 to disable.
        I:"Tank Stack Limit"=1

        # The list of lighters that can relight torches in the Realistic Torches mod. ('item;damage')
        S:"Torch Lighters" <
            pyrotech:flint_and_tinder;1
            pyrotech:bow_drill;1
            pyrotech:bow_drill_durable_spindle;1
            pyrotech:matchstick;1
         >
    }

    ##########################################################################################################
    # contents
    #--------------------------------------------------------------------------------------------------------#
    # Content Options
    ##########################################################################################################

    contents {
        # Whether to add blueprints or not.
        B:"Enable Blueprints"=true

        # Whether to add fluids or not.
        B:"Enable Fluids"=true

        # Whether to add items or not.
        B:"Enable Items"=true

        # Whether to add ores or not.
        B:"Enable Ores"=true
    }

    ##########################################################################################################
    # features
    #--------------------------------------------------------------------------------------------------------#
    # Features Options
    ##########################################################################################################

    features {
        # Whether to prevent the slowness effect from changing player's FOV or not.
        B:"Better Slowness"=true

        # The list of dimensions which can use TPA commands.
        I:Dimensions <
            1
            0
            -1
         >

        # Whether to make the list of dimensions blacklist or not.
        B:"Dimensions Blacklist"=false

        # Whether to add endurance system or not.
        B:"Enable Endurance"=true

        # Whether to add a tooltip for foods or not.
        B:"Enable Food Tooltip"=true

        # Whether to ban infinite fluids or not.
        B:"Enable No Infinite Fluids"=true

        # Whether to install the resourspacks in list automatically or not.
        B:"Enable Resourcepack Auto Installation"=true

        # Whether to add TPA commands or not.
        B:"Enable TPA"=true

        # Use these tools to break blocks will not consume endurance.
        S:"Mining Blacklist" <
            immersiveengineering:drill
         >

        # A product of a mixture of water and lava.
        S:Product=netherex:basalt

        # A list of resourcepacks which will be automatically installed.
        S:Resourcepacks <
            Evolution-Reset-Resource-Pack-1.2.8.zip
            ModernityAdjunct-f3-1.6.zip
            Modernity-f3-3.10.2.zip
         >
    }

}


